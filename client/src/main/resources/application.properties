# Server endpoints
hermes.server.base-url=http://hermes.local/
hermes.server.ws-url=ws://hermes.local/ws
# API paths
hermes.api.register=/api/v1/auth/register
hermes.api.login=/api/v1/auth/login
hermes.api.messages.sync=/api/v1/sync
# Local database
hermes.client.db-path=hermes-local.db
# WebSocket reconnect policy
hermes.client.reconnect-max-attempts=10
hermes.client.reconnect-base-delay-ms=1000
hermes.client.reconnect-max-delay-ms=30000
# STOMP destinations
hermes.stomp.subscribe.messages=/user/queue/messages
hermes.stomp.subscribe.acks=/user/queue/acks
hermes.stomp.send.message=/app/chat.sendMessage
