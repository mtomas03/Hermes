apiVersion: v1
kind: Service
metadata:
  name: hermes-kafka-headless
  namespace: hermes-namespace
spec:
  clusterIP: None
  selector:
    app: hermes-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
