spring:
  application:
    name: hermes-worker

  cassandra:
    keyspace-name: hermes
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none # schema managed via schema.cql
    request:
      timeout: 5s
      consistency: LOCAL_QUORUM

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 1000ms
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: hermes-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        spring.json.trusted.packages: "it.unibo.hermes.*"

hermes:
  topics:
    message-created: ${KAFKA_TOPIC_CREATED:message-created}
    message-acknowledged: ${KAFKA_TOPIC_ACK:message-acknowledged}
    message-delivery: ${KAFKA_TOPIC_DELIVERY:message-delivery}

  delivery:
    max-retry-attempts: 3
    retry-backoff-ms: 1000

  presence:
    key-prefix: "hermes:presence:"
    field-online: online
    field-gateway-id: gatewayId

logging:
  level:
    it.unibo.hermes.worker: DEBUG
    org.springframework.kafka: INFO
