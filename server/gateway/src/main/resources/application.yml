spring:
  application:
    name: hermes-gateway

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/hermes}
    username: ${POSTGRES_USER:hermes}
    password: ${POSTGRES_PASSWORD:hermes}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # auto-create schema on first run
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cassandra:
    keyspace-name: hermes
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none # schema managed via schema.cql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 0 # retries are managed by the adapter
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    consumer:
      group-id: hermes-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hermes.gateway.event"

hermes:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXN0cm9uZy1zZWNyZXQtZm9yLWhlcm1lcy1kZXY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  gateway:
    instance-id: ${GATEWAY_ID:gateway-1}
    heartbeat-timeout-ms: ${HB_TIMEOUT_MS:90000} # 90 s without ping -> disconnect
    heartbeat-check-ms: ${HB_CHECK_MS:30000} # check interval

  kafka:
    topic-messages: hermes-messages
    retry:
      max-attempts: 3
      initial-backoff-ms: 100
      backoff-multiplier: 2.0

  presence:
    ttl-seconds: ${PRESENCE_TTL:300} # 5min TTL on online keys

logging:
  level:
    com.hermes.gateway: DEBUG
    org.springframework.web.socket: INFO
    org.apache.kafka: WARN
