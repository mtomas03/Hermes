name: Hermes CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Upload unit tests reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

  e2e-tests:
    name: E2E Tests on Minikube
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper and Kubernetes scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x k8s/scripts/*.sh

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          container-runtime: docker
          cpus: 4
          memory: 10240m
          addons: ingress

      - name: Deploy Hermes infrastructure and applications
        run: ./k8s/scripts/deploy.sh

      - name: Configure host resolution and wait for Ingress
        run: |
          set -euo pipefail
          
          MINIKUBE_IP="$(minikube ip)"
          echo "Minikube IP: ${MINIKUBE_IP}"
          echo "${MINIKUBE_IP} hermes.local" | sudo tee -a /etc/hosts

          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

          curl --retry 10 --retry-delay 2 --retry-connrefused \
            -s -o /dev/null http://hermes.local || true

      - name: Run E2E tests
        run: ./gradlew --no-daemon e2eTest

      - name: Upload E2E tests reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-reports
          path: |
            e2e/build/test-results/e2eTest/
            e2e/build/reports/tests/e2eTest/
          if-no-files-found: warn
          retention-days: 7